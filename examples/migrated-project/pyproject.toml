[project]
name = "migrated-project"
version = "0.1.0"
description = "Behave BDD project generated by behave-gen."
requires-python = ">=3.11"
dependencies = [
    "behave>=1.2.6",
]

[tool.behave-gen]
features_dir = "features"
steps_dir = "features/steps"
environment_file = "environment.py"
template_engine = "string"
